<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدلية مروة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧴%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#3a8a90;--teal-d:#2b6e73;--red:#c8312b;--gold:#f1c84b;--bg:#f2f7f7;--card:#fff;--tx:#17323a;--mu:#5d7479;--bd:#d6e4e5;--soft:#e4f0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2326;--card:#16333a;--tx:#eaf3f3;--mu:#9bb6b9;--bd:#2a4a50;--soft:#1d4048}}
:root[data-theme="dark"]{--bg:#0e2326;--card:#16333a;--tx:#eaf3f3;--mu:#9bb6b9;--bd:#2a4a50;--soft:#1d4048}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--teal);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid var(--gold)}
header img{width:52px;height:52px;border-radius:10px;background:#fff;object-fit:contain}
header h1{margin:0;font-size:1.25rem;font-weight:800;flex:1}
header small{display:block;font-weight:400;font-size:.8rem;opacity:.9}
.hb{border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--red);color:#fff}
.hb.g{background:var(--gold);color:#3b2f00}
main{max-width:1000px;margin:0 auto;padding:16px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
#q{width:100%;padding:11px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card)}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:2px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;font-size:3.4rem;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--gold);color:#3b2f00;font-size:.75rem;font-weight:800;border-radius:6px;padding:0 8px}
.tag.o{background:var(--red);color:#fff}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:1rem}
.cb p{margin:0;color:var(--mu);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.pr{font-weight:800;color:var(--teal-d);font-size:1.1rem}
:root[data-theme="dark"] .pr{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr{color:var(--gold)}}
.add{border:0;background:var(--red);color:#fff;border-radius:10px;padding:7px;font-weight:600;cursor:pointer}
.add:disabled{background:var(--bd);color:var(--mu);cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:30px}
.note{margin:22px 0 80px;color:var(--mu);font-size:.85rem;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;justify-content:flex-start}
.ov.show{display:flex}
.sheet{background:var(--bg);width:min(460px,100%);height:100%;overflow-y:auto;padding:16px calc(16px) calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet h2{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;font-size:1.2rem}
.x{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.row .n{flex:1;font-size:.92rem}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin:12px 0}
label{display:block;font-size:.85rem;margin:8px 0 3px;color:var(--mu)}
.f{width:100%;padding:9px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--card)}
.pay{background:var(--soft);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.9rem}
.send{display:block;width:100%;text-align:center;border:0;border-radius:12px;background:#1f9d55;color:#fff;font-weight:800;padding:12px;margin-top:10px;cursor:pointer;text-decoration:none}
.fb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:15;width:54px;height:54px;border-radius:50%;background:#1f9d55;display:grid;place-items:center;text-decoration:none;font-size:1.6rem;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.err{color:var(--red);font-size:.85rem;min-height:1.2em}
.sm{font-size:.8rem;padding:4px 10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

function grid(){
 const l=D.products.filter(p=>(cat==="الكل"||(cat==="وصل حديثاً"?p.isNew:p.cat===cat))&&(!term||(p.name+p.desc).includes(term)));
 $("#grid").innerHTML=l.length?l.map(p=>`<div class="card"><div class="pic">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`:esc(ICON[p.cat]||"🛍️")}${p.out?'<span class="tag o">نافد</span>':p.isNew?'<span class="tag">جديد</span>':""}</div><div class="cb"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="pr">${fmt(p.price)}</div><button class="add" data-act="add" data-v="${p.id}"${p.out?" disabled":""}>${p.out?"غير متوفر":"أضف للسلة"}</button></div></div>`).join(""):'<div class="empty">ما لقينا منتجات مطابقة.</div>';
}
function cartUI(){
 const ids=Object.keys(cart).filter(i=>byId(i)&&!byId(i).out);
 let s=0,n=0;
 $("#items").innerHTML=ids.length?ids.map(i=>{const p=byId(i),q=cart[i];s+=p.price*q;n+=q;return `<div class="row"><div class="n">${esc(p.name)}<br><b>${fmt(p.price*q)}</b></div><div class="q"><button data-act="chg" data-v="${i}" data-d="-1" aria-label="أنقص">−</button><span>${q}</span><button data-act="chg" data-v="${i}" data-d="1" aria-label="زِد">+</button></div></div>`}).join(""):'<div class="empty">السلة فاضية. أضف منتجات من الكتالوج.</div>';
 $("#sum").textContent=fmt(s);$("#cc").textContent=n;
 return {ids,s};
}
function render(){chips();grid();cartUI()}

function msg(){
 const {ids,s}=cartUI(),v=i=>$(i).value.trim();
 let t="مرحباً صيدلية مروة 👋\nأرغب بطلب التالي:\n"+ids.map(i=>{const p=byId(i);return `• ${p.name} × ${cart[i]} = ${fmt(p.price*cart[i])}`}).join("\n");
 t+=`\n\nمجموع المنتجات: ${fmt(s)} (بدون التوصيل)\n\nالاسم: ${v("#fn")}\nالجوال: ${v("#fp")}\nالمنطقة: ${v("#fa")}\nالعنوان: ${v("#fd")}`;
 if(v("#fo"))t+="\nملاحظات: "+v("#fo");
 return t+"\n\nالدفع: عند الاستلام\nيرجى تأكيد التوفر وسعر التوصيل. شكراً.";
}
$("#sendb").onclick=()=>{
 const {ids}=cartUI(),e=$("#er");e.textContent="";
 if(!ids.length){e.textContent="السلة فاضية.";return}
 if(!$("#fn").value.trim()||!$("#fp").value.trim()||!$("#fa").value.trim()||!$("#fd").value.trim()){e.textContent="عبّي الاسم والجوال والمنطقة والعنوان.";return}
 const u="https://wa.me/"+WA+"?text="+encodeURIComponent(msg());
 const a=$("#wl");a.href=u;a.hidden=false;a.click();
};


document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-act]");if(!t)return;
 const a=t.dataset.act,v=t.dataset.v;
 if(a==="cat"){cat=v;chips();grid()}
 else if(a==="add"){cart[v]=(cart[v]||0)+1;sv();cartUI();t.textContent="تمت الإضافة ✓";setTimeout(grid,700)}
 else if(a==="chg"){cart[v]=(cart[v]||0)+ +t.dataset.d;if(cart[v]<=0)delete cart[v];sv();cartUI()}
 else if(a==="cart"){$("#ovc").classList.add("show");cartUI()}

 else if(a==="close"){$("#ovc").classList.remove("show")}





});
$("#q").oninput=e=>{term=e.target.value.trim();grid()};
render();

</script>
</body>
</html>
